name: DigitalOcean Docker Image Publish
description: Publish a Docker image to Digital Ocean's Container Registry
branding:
  icon: 'upload-cloud'
  color: 'blue'

inputs:
  image_path:
    description: Image path in the format registry-name/image-name
    required: true
  sha_size:
    description: Number of characters from the commit SHA
    required: false
    default: '8'
  dockerfile:
    description: The path + name of the Dockerfile you want to build (-f flag)
    required: false
    default: 'Dockerfile'
  docker_build_context:
    description: The docker build context (usually '.')
    required: false
    default: '.'

outputs:
  image_digest:
    description: Immutable registry digest of the published image
    value: ${{ steps.published.outputs.image }}
  image_url:
    description: 'Url of the uploaded image with the SHA tag'
    value: ${{ steps.image_tags.outputs.sha }}
  image_latest_url:
    description: 'Url of the uploaded image with the latest tag'
    value: ${{ steps.image_tags.outputs.latest }}

runs:
  using: composite
  steps:
    - name: Generate Image Url
      id: image_url
      shell: bash
      run: echo "value=registry.digitalocean.com/${{ inputs.image_path }}" >> "$GITHUB_OUTPUT"

    - name: Generate Tagged Urls
      id: image_tags
      shell: bash
      run: |
        SHORT_SHA=$(echo $GITHUB_SHA | cut -c1-${{ inputs.sha_size }})
        echo "sha=${{ steps.image_url.outputs.value }}:$SHORT_SHA" >> "$GITHUB_OUTPUT"
        echo "latest=${{ steps.image_url.outputs.value }}:latest" >> "$GITHUB_OUTPUT"
    - name: Build image
      shell: bash
      run: >
        docker build ${{ inputs.docker_build_context }}
        --build-arg SENTRY_RELEASE="opensensor-api@${GITHUB_SHA}"
        -f ${{ inputs.dockerfile }}
        -t ${{ steps.image_tags.outputs.sha }}
        -t ${{ steps.image_tags.outputs.latest }}

    - name: Login to registry
      shell: bash
      if: github.ref == 'refs/heads/main'
      run: doctl registry login --expiry-seconds 600

    - name: Upload image to registry
      shell: bash
      if: github.ref == 'refs/heads/main'
      run: docker push -a ${{ steps.image_url.outputs.value }}

    - name: Resolve the published image digest
      id: published
      shell: bash
      if: github.ref == 'refs/heads/main'
      env:
        IMAGE_TAG: ${{ steps.image_tags.outputs.sha }}
      run: |
        image=$(docker image inspect "$IMAGE_TAG" --format '{{index .RepoDigests 0}}')
        [[ "$image" =~ ^registry\.digitalocean\.com/whitewhale/opensensor@sha256:[a-f0-9]{64}$ ]]
        printf 'image=%s\n' "$image" >> "$GITHUB_OUTPUT"
